<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1999 剧情档案</title>
  <meta name="description" content="《重返未来：1999》简体中文剧情检索 —— 本地索引，非官方" />
  <meta name="theme-color" content="#1B1B1B" />

  <!--
    favicon 用内联 SVG data URI：不新增二进制文件，也不会被 Vite 当资源处理。
    缺了它浏览器会按约定去要 /favicon.ico → 每个页面都留一条 404。
    母题与站头 logo 的 ✦ 一致，配色取 tokens.css 的强调色。
  -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1B1B'/%3E%3Cpath d='M16 4.5l3.1 8.4 8.4 3.1-8.4 3.1L16 27.5l-3.1-8.4L4.5 16l8.4-3.1z' fill='%23CF8D2D'/%3E%3C/svg%3E"
  />

  <!--
    上线形态是把本产物挂进 LightRAG 容器的
    /app/lightrag/api/webui，由后端替换下面这个占位注释，注入
    window.__LIGHTRAG_CONFIG__ = { apiPrefix, webuiPrefix, webuiTitle }。
    占位注释的名字必须与后端一致：lightrag_server.py 的 RUNTIME_CONFIG_PLACEHOLDER。
  -->
  <!-- __LIGHTRAG_RUNTIME_CONFIG__ -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;1,400&family=Noto+Serif+SC:wght@200;400;700;900&family=Roboto+Mono:wght@400&display=swap"
  />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
